import org.apache.tools.ant.filters.ReplaceTokens

plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.mod_group

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"${project.mod_id}" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
	accessWidenerPath = file("src/main/resources/simple_city.accesswidener")
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.mod_version
	inputs.property "id", project.mod_id
	inputs.property "name", project.mod_name
	inputs.property "description", project.mod_desc
	inputs.property "license", project.mod_license

	filesMatching("fabric.mod.json") {
		expand([
		    'version': project.mod_version,
			'id': project.mod_id,
			'name': project.mod_name,
			'description': project.mod_desc,
			'license': project.mod_license
		])
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}


tasks.withType(Javadoc).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.charSet = 'UTF-8'
    it.options.addStringOption 'Xdoclint:none', '-quiet'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

tasks.register('docJar', Jar) {
	dependsOn javadoc
	from javadoc.destinationDir
	archiveClassifier.set('javadoc')
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = "simple_city"
			from components.java
			artifact docJar
			pom {
				licenses {
					license {
						name = "Creative Commons Attribution-NonCommercial-NoDerivatives 4.0 International"
						url = "https://creativecommons.org/licenses/by-nc-nd/4.0/"
					}
				}
			}
		}
	}
	repositories {
		maven {
			name = "SimpleCity"
			url = file("D:/Website/xzmetro.github.io/maven")
		}
	}
}

tasks.build {
	dependsOn tasks.docJar
	dependsOn tasks.publish
}
